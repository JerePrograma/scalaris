<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">Lanzamiento de Scalaris Catálogo</title><desc id="desc">Planes Vidriera, Flujo y Pulso. Mensual con alta en tres cuotas; anual con diez por ciento menos en abono, alta bonificada según plan y dominio por un año.</desc><rect width="1080" height="1350" fill="#f4f7fa"/><g font-family="Inter,Arial,sans-serif"><text x="60" y="72" font-size="27" font-weight="700" letter-spacing="4" fill="#145cdb">SCALARIS · LANZAMIENTO</text><text x="60" y="141" font-size="49" font-weight="700" fill="#0b1f33">Tu catálogo, listo</text><text x="60" y="198" font-size="49" font-weight="700" fill="#0b1f33">para tu próxima venta.</text><text x="60" y="253" font-size="23" fill="#536879">Tu marca · Productos editables · Pedidos por WhatsApp</text><g><rect x="60" y="300" width="960" height="218" rx="18" fill="#fff" stroke="#d9e3ed"/><text x="88" y="345" font-size="34" font-weight="700" fill="#0b1f33">Vidriera</text><text x="88" y="382" font-size="20" fill="#536879">Mostrá lo que vendés</text><text x="88" y="419" font-size="20" fill="#536879">Hasta 100 productos · carga inicial 30</text><text x="88" y="458" font-size="20" fill="#0b1f33">Alta mensual: $ 50.000 en 3 cuotas</text><text x="88" y="493" font-size="18" fill="#145cdb">Con anual: alta 100% bonificada</text><text x="678" y="347" font-size="36" font-weight="700" fill="#145cdb">$ 15.000/mes</text><text x="678" y="379" font-size="17" fill="#536879">Más las cuotas de puesta en marcha</text><text x="678" y="441" font-size="34" font-weight="700" fill="#0b1f33">$ 162.000</text><text x="678" y="474" font-size="17" fill="#536879">Total anticipado por 12 meses</text><text x="678" y="499" font-size="16" fill="#536879">Incluye el alta promocional</text></g><g><rect x="60" y="540" width="960" height="218" rx="18" fill="#fff" stroke="#d9e3ed"/><text x="88" y="585" font-size="34" font-weight="700" fill="#0b1f33">Flujo</text><text x="88" y="622" font-size="20" fill="#536879">Organizá cada pedido</text><text x="88" y="659" font-size="20" fill="#536879">Hasta 300 productos · carga inicial 60</text><text x="88" y="698" font-size="20" fill="#0b1f33">Alta mensual: $ 75.000 en 3 cuotas</text><text x="88" y="733" font-size="18" fill="#145cdb">Con anual: alta 50% bonificada</text><text x="678" y="587" font-size="36" font-weight="700" fill="#145cdb">$ 25.000/mes</text><text x="678" y="619" font-size="17" fill="#536879">Más las cuotas de puesta en marcha</text><text x="678" y="681" font-size="34" font-weight="700" fill="#0b1f33">$ 307.500</text><text x="678" y="714" font-size="17" fill="#536879">Total anticipado por 12 meses</text><text x="678" y="739" font-size="16" fill="#536879">Incluye el alta promocional</text></g><g><rect x="60" y="780" width="960" height="218" rx="18" fill="#fff" stroke="#d9e3ed"/><text x="88" y="825" font-size="34" font-weight="700" fill="#0b1f33">Pulso</text><text x="88" y="862" font-size="20" fill="#536879">Seguile el pulso al día</text><text x="88" y="899" font-size="20" fill="#536879">Hasta 1.000 productos · carga inicial 100</text><text x="88" y="938" font-size="20" fill="#0b1f33">Alta mensual: $ 100.000 en 3 cuotas</text><text x="88" y="973" font-size="18" fill="#145cdb">Con anual: alta 50% bonificada</text><text x="678" y="827" font-size="36" font-weight="700" fill="#145cdb">$ 35.000/mes</text><text x="678" y="859" font-size="17" fill="#536879">Más las cuotas de puesta en marcha</text><text x="678" y="921" font-size="34" font-weight="700" fill="#0b1f33">$ 428.000</text><text x="678" y="954" font-size="17" fill="#536879">Total anticipado por 12 meses</text><text x="678" y="979" font-size="16" fill="#536879">Incluye el alta promocional</text></g><text x="60" y="1065" font-size="20" fill="#0b1f33">Anual: 10% menos en el abono y primer año de dominio .com.ar incluido.</text><text x="60" y="1102" font-size="19" fill="#536879">Primeros 5 clientes nuevos o hasta el 30/11/2026, lo que ocurra primero.</text><text x="60" y="1137" font-size="19" fill="#536879">Cupo, disponibilidad y vinculación del dominio a confirmar antes de contratar.</text><text x="60" y="1172" font-size="19" fill="#536879">Renovación del dominio a cargo del cliente. Precios finales en ARS.</text><text x="60" y="1207" font-size="18" fill="#536879">60 min de ayuda inicial. Sin pagos online ni facturación fiscal. Correo aparte.</text><text x="60" y="1261" font-size="28" font-weight="700" fill="#145cdb">scalaris.com.ar/catalogo/</text><text x="60" y="1307" font-size="20" fill="#536879">WhatsApp 11 7278-9289 · Un negocio, una sucursal, un WhatsApp</text></g></svg>

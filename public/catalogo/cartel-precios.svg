<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">Planes de Scalaris Catálogo</title><desc id="desc">Abono mensual más puesta en marcha. Plan anual opcional con diez por ciento de descuento en el abono.</desc><rect width="1080" height="1350" fill="#f4f7fa"/><g font-family="Inter,Arial,sans-serif"><text x="64" y="83" font-size="29" font-weight="750" letter-spacing="4" fill="#145cdb">SCALARIS</text><text x="64" y="157" font-size="51" font-weight="650" fill="#0b1f33">Tu catálogo, listo</text><text x="64" y="215" font-size="51" font-weight="650" fill="#0b1f33">para compartir.</text><text x="64" y="270" font-size="25" fill="#536879">Tu marca. Productos editables. Pedidos por WhatsApp.</text><g><rect x="64" y="315" width="952" height="220" rx="20" fill="#fff" stroke="#d9e3ed"/><text x="92" y="364" font-size="34" font-weight="650" fill="#0b1f33">Vidriera</text><text x="92" y="403" font-size="21" fill="#536879">Mostrá lo que vendés</text><text x="92" y="448" font-size="20" fill="#536879">Hasta 100 productos · carga inicial de 10</text><text x="92" y="494" font-size="21" fill="#0b1f33">Puesta en marcha: $ 50.000</text><text x="648" y="371" font-size="43" font-weight="650" fill="#145cdb">$ 15.000</text><text x="648" y="404" font-size="20" fill="#536879">por mes</text><text x="648" y="458" font-size="24" fill="#0b1f33">$ 13.500/mes</text><text x="648" y="492" font-size="17" fill="#536879">con pago anual anticipado</text></g><g><rect x="64" y="560" width="952" height="220" rx="20" fill="#fff" stroke="#d9e3ed"/><text x="92" y="609" font-size="34" font-weight="650" fill="#0b1f33">Flujo</text><text x="92" y="648" font-size="21" fill="#536879">Organizá cada pedido</text><text x="92" y="693" font-size="20" fill="#536879">Hasta 300 productos · carga inicial de 20</text><text x="92" y="739" font-size="21" fill="#0b1f33">Puesta en marcha: $ 75.000</text><text x="648" y="616" font-size="43" font-weight="650" fill="#145cdb">$ 25.000</text><text x="648" y="649" font-size="20" fill="#536879">por mes</text><text x="648" y="703" font-size="24" fill="#0b1f33">$ 22.500/mes</text><text x="648" y="737" font-size="17" fill="#536879">con pago anual anticipado</text></g><g><rect x="64" y="805" width="952" height="220" rx="20" fill="#fff" stroke="#d9e3ed"/><text x="92" y="854" font-size="34" font-weight="650" fill="#0b1f33">Pulso</text><text x="92" y="893" font-size="21" fill="#536879">Seguile el pulso al día</text><text x="92" y="938" font-size="20" fill="#536879">Hasta 1.000 productos · carga inicial de 30</text><text x="92" y="984" font-size="21" fill="#0b1f33">Puesta en marcha: $ 100.000</text><text x="648" y="861" font-size="43" font-weight="650" fill="#145cdb">$ 35.000</text><text x="648" y="894" font-size="20" fill="#536879">por mes</text><text x="648" y="948" font-size="24" fill="#0b1f33">$ 31.500/mes</text><text x="648" y="982" font-size="17" fill="#536879">con pago anual anticipado</text></g><text x="64" y="1106" font-size="21" fill="#0b1f33">Anual opcional: 10% menos en el abono. Alta en ambas modalidades.</text><text x="64" y="1146" font-size="20" fill="#536879">Precios finales ARS · Contrataciones hasta el 30/11/2026.</text><text x="64" y="1183" font-size="20" fill="#536879">Dominio y correo aparte. Sin pagos online ni facturación fiscal.</text><text x="64" y="1247" font-size="29" font-weight="650" fill="#145cdb">scalaris.com.ar/catalogo/</text><text x="64" y="1292" font-size="20" fill="#536879">Un negocio · Una sucursal · Un WhatsApp</text></g></svg>

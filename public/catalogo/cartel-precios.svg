<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">Planes de Scalaris Catálogo</title><desc id="desc">Vidriera, Flujo y Pulso. Abonos mensuales e implementación por separado. Anual opcional con diez por ciento menos sólo en el abono.</desc><rect width="1080" height="1350" fill="#f4f7fa"/><g font-family="Inter,Arial,sans-serif"><text x="60" y="72" font-size="27" font-weight="700" letter-spacing="4" fill="#145cdb">SCALARIS · CATÁLOGO</text><text x="60" y="141" font-size="49" font-weight="700" fill="#0b1f33">Tu catálogo, listo</text><text x="60" y="198" font-size="49" font-weight="700" fill="#0b1f33">para tu próxima venta.</text><text x="60" y="253" font-size="23" fill="#536879">Tu marca · Productos editables · Pedidos por WhatsApp</text><g><rect x="60" y="300" width="960" height="218" rx="18" fill="#fff" stroke="#d9e3ed"/><text x="88" y="345" font-size="34" font-weight="700" fill="#0b1f33">Vidriera</text><text x="88" y="382" font-size="20" fill="#536879">Mostrá lo que vendés</text><text x="88" y="419" font-size="19" fill="#536879">Hasta 100 productos</text><text x="88" y="458" font-size="19" fill="#0b1f33">Carga inicial: 30 productos</text><text x="88" y="492" font-size="17" fill="#536879">Dirección de Scalaris incluida</text><text x="665" y="349" font-size="40" font-weight="700" fill="#145cdb">$ 15.000/mes</text><text x="665" y="381" font-size="17" fill="#536879">Pagando mes a mes</text><text x="665" y="424" font-size="19" fill="#0b1f33">Implementación $ 50.000</text><text x="665" y="454" font-size="17" fill="#536879">Por única vez, por separado</text><text x="665" y="488" font-size="17" fill="#536879">Anual: $ 13.500/mes eq.</text></g><g><rect x="60" y="540" width="960" height="218" rx="18" fill="#fff" stroke="#d9e3ed"/><text x="88" y="585" font-size="34" font-weight="700" fill="#0b1f33">Flujo</text><text x="88" y="622" font-size="20" fill="#536879">Organizá cada pedido</text><text x="88" y="659" font-size="19" fill="#536879">Hasta 300 productos</text><text x="88" y="698" font-size="19" fill="#0b1f33">Carga inicial: 60 productos</text><text x="88" y="732" font-size="17" fill="#536879">Dirección de Scalaris incluida</text><text x="665" y="589" font-size="40" font-weight="700" fill="#145cdb">$ 25.000/mes</text><text x="665" y="621" font-size="17" fill="#536879">Pagando mes a mes</text><text x="665" y="664" font-size="19" fill="#0b1f33">Implementación $ 75.000</text><text x="665" y="694" font-size="17" fill="#536879">Por única vez, por separado</text><text x="665" y="728" font-size="17" fill="#536879">Anual: $ 22.500/mes eq.</text></g><g><rect x="60" y="780" width="960" height="218" rx="18" fill="#fff" stroke="#d9e3ed"/><text x="88" y="825" font-size="34" font-weight="700" fill="#0b1f33">Pulso</text><text x="88" y="862" font-size="20" fill="#536879">Seguile el pulso al día</text><text x="88" y="899" font-size="19" fill="#536879">Hasta 1.000 productos</text><text x="88" y="938" font-size="19" fill="#0b1f33">Carga inicial: 100 productos</text><text x="88" y="972" font-size="17" fill="#536879">Dirección de Scalaris incluida</text><text x="665" y="829" font-size="40" font-weight="700" fill="#145cdb">$ 35.000/mes</text><text x="665" y="861" font-size="17" fill="#536879">Pagando mes a mes</text><text x="665" y="904" font-size="19" fill="#0b1f33">Implementación $ 100.000</text><text x="665" y="934" font-size="17" fill="#536879">Por única vez, por separado</text><text x="665" y="968" font-size="17" fill="#536879">Anual: $ 31.500/mes eq.</text></g><text x="60" y="1065" font-size="20" fill="#0b1f33">Anual opcional: doce meses anticipados, 10% menos sólo en el abono.</text><text x="60" y="1102" font-size="19" fill="#536879">La implementación conserva su precio en ambas modalidades.</text><text x="60" y="1137" font-size="19" fill="#536879">Dominio propio, renovación y correo por separado.</text><text x="60" y="1172" font-size="19" fill="#536879">Precios finales en ARS. Configuración y alcance acordados.</text><text x="60" y="1207" font-size="18" fill="#536879">Sin pagos online ni facturación fiscal. Caja manual según plan.</text><text x="60" y="1261" font-size="28" font-weight="700" fill="#145cdb">scalaris.com.ar/catalogo/</text><text x="60" y="1307" font-size="20" fill="#536879">WhatsApp 11 7278-9289 · Un negocio, una sucursal, un WhatsApp</text></g></svg>

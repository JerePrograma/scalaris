<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">Planes de Scalaris Catálogo</title><desc id="desc">Vidriera, Flujo y Pulso. Mensual sin descuento con puesta en marcha. Anual anticipado con ahorro en el abono y puesta en marcha 100% bonificada. Vidriera: $ 70.000 por mes; anual $ 60.000 por mes equivalente, total $ 720.000 anticipado. Flujo: $ 90.000 por mes; anual $ 80.000 por mes equivalente, total $ 960.000 anticipado. Pulso: $ 115.000 por mes; anual $ 100.000 por mes equivalente, total $ 1.200.000 anticipado.</desc><rect width="1080" height="1350" fill="#f4f7fa"/><g font-family="Inter,Arial,sans-serif"><text x="60" y="72" font-size="27" font-weight="700" letter-spacing="4" fill="#145cdb">SCALARIS · CATÁLOGO</text><text x="60" y="141" font-size="49" font-weight="700" fill="#0b1f33">Tu catálogo, con tu marca.</text><text x="60" y="194" font-size="30" fill="#0b1f33">Compará mes a mes y anual anticipado.</text><text x="60" y="237" font-size="21" fill="#536879">Diseño personalizado · Productos editables · Pedidos por WhatsApp</text><g><rect x="60" y="270" width="960" height="245" rx="18" fill="#fff" stroke="#d9e3ed"/><text x="84" y="305" font-size="29" font-weight="700" fill="#0b1f33">Vidriera</text><text x="84" y="332" font-size="17" font-weight="400" fill="#536879">Hasta 100 productos · 2 administradores · Capacitación 1 hora</text><text x="84" y="363" font-size="15" font-weight="600" fill="#0b1f33">MES A MES · SIN DESCUENTO</text><text x="84" y="396" font-size="30" font-weight="700" fill="#0b1f33">$ 70.000/mes</text><text x="84" y="424" font-size="18" font-weight="400" fill="#536879">Puesta en marcha: $ 300.000</text><text x="84" y="451" font-size="18" font-weight="600" fill="#0b1f33">Total inicial primer mes: $ 370.000</text><rect x="545" y="346" width="450" height="132" rx="10" fill="#eaf7f5" stroke="#94cfc2"/><text x="562" y="372" font-size="19" font-weight="700" fill="#123e36">ANUAL · $ 60.000/mes equivalente</text><text x="562" y="400" font-size="18" font-weight="600" fill="#123e36">Total a pagar por 12 meses: $ 720.000</text><text x="562" y="425" font-size="17" font-weight="400" fill="#123e36">Puesta en marcha: $ 0 · 100% bonificada</text><text x="562" y="451" font-size="17" font-weight="400" fill="#123e36">Ahorro en el abono: $ 120.000</text><text x="84" y="495" font-size="18" font-weight="600" fill="#123e36">Ahorro total del primer año (abono + alta): $ 420.000</text></g><g><rect x="60" y="535" width="960" height="245" rx="18" fill="#fff" stroke="#d9e3ed"/><text x="84" y="570" font-size="29" font-weight="700" fill="#0b1f33">Flujo</text><text x="84" y="597" font-size="17" font-weight="400" fill="#536879">Hasta 300 productos · 4 administradores · Capacitación 2 horas</text><text x="84" y="628" font-size="15" font-weight="600" fill="#0b1f33">MES A MES · SIN DESCUENTO</text><text x="84" y="661" font-size="30" font-weight="700" fill="#0b1f33">$ 90.000/mes</text><text x="84" y="689" font-size="18" font-weight="400" fill="#536879">Puesta en marcha: $ 450.000</text><text x="84" y="716" font-size="18" font-weight="600" fill="#0b1f33">Total inicial primer mes: $ 540.000</text><rect x="545" y="611" width="450" height="132" rx="10" fill="#eaf7f5" stroke="#94cfc2"/><text x="562" y="637" font-size="19" font-weight="700" fill="#123e36">ANUAL · $ 80.000/mes equivalente</text><text x="562" y="665" font-size="18" font-weight="600" fill="#123e36">Total a pagar por 12 meses: $ 960.000</text><text x="562" y="690" font-size="17" font-weight="400" fill="#123e36">Puesta en marcha: $ 0 · 100% bonificada</text><text x="562" y="716" font-size="17" font-weight="400" fill="#123e36">Ahorro en el abono: $ 120.000</text><text x="84" y="760" font-size="18" font-weight="600" fill="#123e36">Ahorro total del primer año (abono + alta): $ 570.000</text></g><g><rect x="60" y="800" width="960" height="245" rx="18" fill="#fff" stroke="#d9e3ed"/><text x="84" y="835" font-size="29" font-weight="700" fill="#0b1f33">Pulso</text><text x="84" y="862" font-size="17" font-weight="400" fill="#536879">Hasta 1.000 productos · 6 administradores · Capacitación 3 horas</text><text x="84" y="893" font-size="15" font-weight="600" fill="#0b1f33">MES A MES · SIN DESCUENTO</text><text x="84" y="926" font-size="30" font-weight="700" fill="#0b1f33">$ 115.000/mes</text><text x="84" y="954" font-size="18" font-weight="400" fill="#536879">Puesta en marcha: $ 650.000</text><text x="84" y="981" font-size="18" font-weight="600" fill="#0b1f33">Total inicial primer mes: $ 765.000</text><rect x="545" y="876" width="450" height="132" rx="10" fill="#eaf7f5" stroke="#94cfc2"/><text x="562" y="902" font-size="19" font-weight="700" fill="#123e36">ANUAL · $ 100.000/mes equivalente</text><text x="562" y="930" font-size="18" font-weight="600" fill="#123e36">Total a pagar por 12 meses: $ 1.200.000</text><text x="562" y="955" font-size="17" font-weight="400" fill="#123e36">Puesta en marcha: $ 0 · 100% bonificada</text><text x="562" y="981" font-size="17" font-weight="400" fill="#123e36">Ahorro en el abono: $ 180.000</text><text x="84" y="1025" font-size="18" font-weight="600" fill="#123e36">Ahorro total del primer año (abono + alta): $ 830.000</text></g><text x="60" y="1080" font-size="20" fill="#123e36">El anual se paga por adelantado. Puesta en marcha 100% bonificada.</text><text x="60" y="1119" font-size="19" fill="#536879">Ahorro comparado con 12 abonos mensuales a la misma tarifa + alta.</text><text x="60" y="1158" font-size="19" fill="#536879">Dominio propio, renovación y correo por separado. Precios finales en ARS.</text><text x="60" y="1197" font-size="18" fill="#536879">Sin pagos online ni facturación fiscal. Caja manual según plan.</text><text x="60" y="1255" font-size="28" font-weight="700" fill="#145cdb">scalaris.com.ar/catalogo/</text><text x="60" y="1300" font-size="20" fill="#536879">WhatsApp 11 7278-9289 · Un negocio, una sucursal, un WhatsApp</text></g></svg>

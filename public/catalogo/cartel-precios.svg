<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">Scalaris Catálogo: Vidriera; Flujo; Pulso</title><desc id="desc">Vidriera: $ 10.000 por mes con plan anual o $ 15.000 mes a mes más instalación por única vez de $ 30.000. Flujo: $ 20.000 por mes con plan anual o $ 30.000 mes a mes más instalación por única vez de $ 50.000. Pulso: $ 30.000 por mes con plan anual o $ 45.000 mes a mes más instalación por única vez de $ 80.000.</desc><g font-family="Inter,Segoe UI,Arial,sans-serif"><rect width="1080" height="1350" fill="#eef5fa"/><text x="64" y="100" font-size="31" font-weight="800" letter-spacing="4" fill="#145cdb">SCALARIS</text><text x="64" y="139" font-size="25" fill="#0b1f33">Catálogo</text><text x="64" y="203" font-size="42" font-weight="650" fill="#0b1f33">Planes de catálogo para WhatsApp.</text><text x="64" y="247" font-size="26" fill="#496479">Productos, pedidos y caja manual según el plan.</text><rect x="64" y="277" width="952" height="43" rx="21" fill="#53c9f4"/><text x="90" y="305" font-size="20" font-weight="700" fill="#0b1f33">PAGÁ EL AÑO: 33,3% MENOS EN EL ABONO + INSTALACIÓN BONIFICADA</text><g><rect x="64" y="337" width="952" height="211" rx="28" fill="#fff" stroke="#d7e3ed"/><text x="94" y="373" font-size="27" font-weight="700" fill="#0b1f33">Vidriera</text><text x="94" y="439" font-size="22" fill="#0b1f33">Productos, precios y carrito</text><text x="94" y="471" font-size="22" fill="#0b1f33">Pedido por WhatsApp</text><text x="94" y="516" font-size="19" fill="#496479">Hasta 100 productos · 1 administrador</text><text x="628" y="385" font-size="44" font-weight="700" fill="#0b1f33">$ 10.000</text><text x="628" y="417" font-size="20" fill="#0b1f33">/ mes con plan anual</text><text x="628" y="450" font-size="21" fill="#0b1f33">Instalación bonificada</text><text x="628" y="488" font-size="20" fill="#496479">Mes a mes: $ 15.000</text><text x="628" y="517" font-size="18" fill="#496479">+ instalación $ 30.000</text></g><g><rect x="64" y="572" width="952" height="211" rx="28" fill="#0b1f33" stroke="#0b1f33"/><text x="94" y="608" font-size="27" font-weight="700" fill="#fff">Flujo</text><text x="94" y="674" font-size="22" fill="#fff">Suma solicitudes guardadas</text><text x="94" y="706" font-size="22" fill="#fff">Estados y enlace de seguimiento</text><text x="94" y="751" font-size="19" fill="#c5d7e8">Hasta 300 productos · 2 administradores</text><text x="628" y="620" font-size="44" font-weight="700" fill="#fff">$ 20.000</text><text x="628" y="652" font-size="20" fill="#fff">/ mes con plan anual</text><text x="628" y="685" font-size="21" fill="#fff">Instalación bonificada</text><text x="628" y="723" font-size="20" fill="#c5d7e8">Mes a mes: $ 30.000</text><text x="628" y="752" font-size="18" fill="#c5d7e8">+ instalación $ 50.000</text></g><g><rect x="64" y="807" width="952" height="211" rx="28" fill="#fff" stroke="#d7e3ed"/><text x="94" y="843" font-size="27" font-weight="700" fill="#0b1f33">Pulso</text><text x="94" y="909" font-size="22" fill="#0b1f33">Suma caja manual</text><text x="94" y="941" font-size="22" fill="#0b1f33">Ingresos, egresos y cierre</text><text x="94" y="986" font-size="19" fill="#496479">Hasta 1.000 productos · 3 administradores</text><text x="628" y="855" font-size="44" font-weight="700" fill="#0b1f33">$ 30.000</text><text x="628" y="887" font-size="20" fill="#0b1f33">/ mes con plan anual</text><text x="628" y="920" font-size="21" fill="#0b1f33">Instalación bonificada</text><text x="628" y="958" font-size="20" fill="#496479">Mes a mes: $ 45.000</text><text x="628" y="987" font-size="18" fill="#496479">+ instalación $ 80.000</text></g><line x1="64" y1="1074" x2="1016" y2="1074" stroke="#d7e3ed"/><text x="64" y="1116" font-size="22" fill="#0b1f33">Pago anual anticipado. Precio fijo por 12 meses desde la activación.</text><text x="64" y="1154" font-size="21" fill="#496479">Precios finales en ARS · Promoción hasta el 30/11/2026.</text><text x="64" y="1201" font-size="25" font-weight="650" fill="#145cdb">scalaris.com.ar/catalogo/</text><text x="64" y="1243" font-size="20" fill="#496479">Un negocio · Una sucursal · Un WhatsApp</text><text x="64" y="1282" font-size="18" fill="#496479">Implementación asistida. Alcance y activación coordinados con Scalaris.</text></g></svg>

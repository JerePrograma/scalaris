<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">Scalaris Catálogo — planes Base, Pedidos y Gestión</title><desc id="desc">Base: $ 10.000 por mes equivalente anual, $ 120.000 anticipados o $ 15.000 mes a mes más alta de $ 30.000. Pedidos: $ 20.000 por mes equivalente anual, $ 240.000 anticipados o $ 30.000 mes a mes más alta de $ 50.000. Gestión: $ 30.000 por mes equivalente anual, $ 360.000 anticipados o $ 45.000 mes a mes más alta de $ 80.000.</desc><g font-family="Inter,Segoe UI,Arial,sans-serif"><rect width="1080" height="1350" fill="#eef5fa"/><text x="64" y="100" font-size="31" font-weight="800" letter-spacing="4" fill="#145cdb">SCALARIS</text><text x="64" y="139" font-size="25" fill="#0b1f33">Catálogo</text><text x="64" y="203" font-size="43" font-weight="650" fill="#0b1f33">Tu negocio, con una web propia.</text><text x="64" y="247" font-size="28" fill="#496479">Tu marca. Tus productos. Tus pedidos.</text><rect x="64" y="277" width="952" height="43" rx="21" fill="#53c9f4"/><text x="90" y="305" font-size="20" font-weight="700" fill="#0b1f33">PAGÁ EL AÑO: 33,3% MENOS EN EL ABONO + ALTA BONIFICADA</text><g><rect x="64" y="337" width="952" height="211" rx="28" fill="#fff" stroke="#d7e3ed"/><text x="94" y="382" font-size="32" font-weight="700" fill="#0b1f33">Base</text><text x="94" y="424" font-size="23" fill="#0b1f33">Tu web + catálogo editable</text><text x="94" y="458" font-size="23" fill="#0b1f33">Carrito para WhatsApp</text><text x="94" y="506" font-size="20" fill="#496479">Hasta 100 productos · 1 administrador</text><text x="628" y="385" font-size="44" font-weight="700" fill="#0b1f33">$ 10.000</text><text x="628" y="417" font-size="20" fill="#0b1f33">/ mes equivalente anual</text><text x="628" y="450" font-size="21" fill="#0b1f33">$ 120.000 por 12 meses</text><text x="628" y="488" font-size="20" fill="#496479">Mes a mes: $ 15.000</text><text x="628" y="517" font-size="18" fill="#496479">+ alta única $ 30.000</text></g><g><rect x="64" y="572" width="952" height="211" rx="28" fill="#0b1f33" stroke="#0b1f33"/><text x="94" y="617" font-size="32" font-weight="700" fill="#fff">Pedidos</text><text x="94" y="659" font-size="23" fill="#fff">Todo Base + pedidos guardados</text><text x="94" y="693" font-size="23" fill="#fff">Estados y seguimiento</text><text x="94" y="741" font-size="20" fill="#c5d7e8">Hasta 300 productos · 2 administradores</text><text x="628" y="620" font-size="44" font-weight="700" fill="#fff">$ 20.000</text><text x="628" y="652" font-size="20" fill="#fff">/ mes equivalente anual</text><text x="628" y="685" font-size="21" fill="#fff">$ 240.000 por 12 meses</text><text x="628" y="723" font-size="20" fill="#c5d7e8">Mes a mes: $ 30.000</text><text x="628" y="752" font-size="18" fill="#c5d7e8">+ alta única $ 50.000</text></g><g><rect x="64" y="807" width="952" height="211" rx="28" fill="#fff" stroke="#d7e3ed"/><text x="94" y="852" font-size="32" font-weight="700" fill="#0b1f33">Gestión</text><text x="94" y="894" font-size="23" fill="#0b1f33">Todo Pedidos + caja manual</text><text x="94" y="928" font-size="23" fill="#0b1f33">Ingresos, egresos y cierres</text><text x="94" y="976" font-size="20" fill="#496479">Hasta 1.000 productos · 3 administradores</text><text x="628" y="855" font-size="44" font-weight="700" fill="#0b1f33">$ 30.000</text><text x="628" y="887" font-size="20" fill="#0b1f33">/ mes equivalente anual</text><text x="628" y="920" font-size="21" fill="#0b1f33">$ 360.000 por 12 meses</text><text x="628" y="958" font-size="20" fill="#496479">Mes a mes: $ 45.000</text><text x="628" y="987" font-size="18" fill="#496479">+ alta única $ 80.000</text></g><line x1="64" y1="1074" x2="1016" y2="1074" stroke="#d7e3ed"/><text x="64" y="1116" font-size="22" fill="#0b1f33">Pago anual anticipado. Precio fijo por 12 meses desde la activación.</text><text x="64" y="1154" font-size="21" fill="#496479">Precios finales en ARS · Promoción hasta el 30/11/2026.</text><text x="64" y="1201" font-size="25" font-weight="650" fill="#145cdb">scalaris.com.ar/catalogo/</text><text x="64" y="1243" font-size="20" fill="#496479">Un negocio · Una sucursal · Un WhatsApp</text><text x="64" y="1282" font-size="18" fill="#496479">Implementación asistida. Alcance y activación coordinados con Scalaris.</text></g></svg>

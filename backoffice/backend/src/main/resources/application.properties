server.address=${SCALARIS_BIND:127.0.0.1}
server.port=${SCALARIS_PORT:8081}
server.forward-headers-strategy=none
server.error.include-message=never
spring.datasource.url=${SCALARIS_DB_URL:jdbc:postgresql://127.0.0.1:5433/scalaris}
spring.datasource.username=${SCALARIS_DB_USER:postgres}
spring.datasource.password=${SCALARIS_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=8
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.jackson.time-zone=America/Argentina/Buenos_Aires
spring.jackson.generator.write-bigdecimal-as-plain=true
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB
scalaris.storage=${SCALARIS_STORAGE:${user.home}/ScalarisData/attachments}
scalaris.allowed-origins=${SCALARIS_ORIGINS:http://localhost:8081,http://127.0.0.1:8081}
spring.web.resources.cache.cachecontrol.no-store=true
logging.level.org.springframework.web=warn
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
